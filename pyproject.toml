[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-lending-risk"
version = "0.1.0"
description = "Evaluate collateral health, oracle freshness and constrained liquidation scenarios with Decimal arithmetic."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-lending-risk = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
